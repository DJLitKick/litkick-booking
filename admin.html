<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>DJ LitKick — Booking Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;1,14..32,300;1,14..32,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <a class="site-logo" href="index.html">DJ <span class="accent">LitKick</span></a>
    <a class="nav-cta" href="index.html">Back To Site</a>
  </header>

  <!-- PASSWORD GATE -->
  <div class="admin-gate" id="admin-gate">
    <div class="admin-gate-box">
      <span class="section-label">Admin Access</span>
      <div class="form-field">
        <label for="admin-password">Password</label>
        <input type="password" id="admin-password" autocomplete="current-password" />
      </div>
      <p class="form-error" id="admin-gate-error"></p>
      <button type="button" class="cta-button" id="admin-gate-submit">Enter</button>
    </div>
  </div>

  <!-- MAIN -->
  <main class="admin-main">

    <!-- ADD BOOKING -->
    <div class="admin-add-panel">
      <span class="section-label">Manual Entry</span>
      <h2 class="form-heading">Add A Booking</h2>
      <p class="admin-add-hint">For bookings made outside the site (phone, Instagram, in person). Added as confirmed and blocks the date immediately.</p>
      <form id="admin-add-form" novalidate>
        <div class="form-row" style="margin-top:1rem;">
          <div class="form-field">
            <label for="add-first-name">First Name</label>
            <input type="text" id="add-first-name" required />
          </div>
          <div class="form-field">
            <label for="add-last-name">Last Name</label>
            <input type="text" id="add-last-name" required />
          </div>
        </div>
        <div class="form-field" style="margin-top:1.2rem;">
          <label for="add-location">Club / Location / City</label>
          <input type="text" id="add-location" required />
        </div>
        <div class="form-row" style="margin-top:1.2rem;">
          <div class="form-field">
            <label for="add-event-type">Event Type</label>
            <select id="add-event-type" required>
              <option value="" disabled selected>Select an event type</option>
              <option value="club">Club Night</option>
              <option value="wedding">Wedding</option>
              <option value="private">Private Event</option>
              <option value="business">Business Event</option>
            </select>
          </div>
          <div class="form-field">
            <label for="add-event-date">Date</label>
            <input type="date" id="add-event-date" required />
          </div>
        </div>
        <div class="form-checkbox" style="margin-top:1.2rem;">
          <input type="checkbox" id="add-technique-needed" />
          <label for="add-technique-needed">Technical equipment (sound/lighting) required</label>
        </div>
        <div class="form-field" style="margin-top:1.2rem;">
          <label for="add-email">Email Address</label>
          <input type="email" id="add-email" required />
        </div>
        <p class="form-error" id="admin-add-error"></p>
        <p class="form-status" id="admin-add-status"></p>
        <button type="submit" class="cta-button" id="admin-add-submit" style="margin-top:0.5rem;">Add Booking</button>
      </form>
    </div>

    <h1 class="admin-heading">All Bookings</h1>
    <p class="form-status" id="admin-status" style="margin-bottom:1.5rem;"></p>
    <div id="admin-list"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
